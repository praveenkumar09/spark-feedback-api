# Spark Feedback API stack: the API and its Postgres. Strapi (the questions editor) is a separate project: ../spark-feedback-strapi.
# Start this stack first: it creates the shared network `spark_feedback_net` that Strapi joins.
# Host ports: API 8090, Postgres 5434. They do not clash with the other projects here.

services:

  spark-feedback-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark_feedback_api
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-4.1}
      AZURE_OPENAI_TRANSCRIBE_DEPLOYMENT: ${AZURE_OPENAI_TRANSCRIBE_DEPLOYMENT:-gpt-4o-transcribe}
      AZURE_OPENAI_TTS_DEPLOYMENT: ${AZURE_OPENAI_TTS_DEPLOYMENT:-}
      SPARK_DECISION_DEPLOYMENT: ${SPARK_DECISION_DEPLOYMENT:-${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-4.1}}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spark
      SPRING_DATASOURCE_USERNAME: spark
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-spark}
      STRAPI_URL: ${STRAPI_URL:-http://strapi:1337}   # the Strapi stack's container answers to the name `strapi` on the shared network
      SPARK_ADMIN_PASSWORD: ${SPARK_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3003}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # One database, two schemas: `strapi` (the questions) and `feedback` (policies, sessions, answers).
  postgres:
    image: postgres:16-alpine
    container_name: spark_feedback_postgres
    environment:
      POSTGRES_DB: spark
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spark}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - spark_feedback_pg_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d spark"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
    name: spark_feedback_net

volumes:
  spark_feedback_pg_data:
