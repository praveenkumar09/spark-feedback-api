# Spark Feedback API stack: the API, its Postgres, and Strapi (the tool that holds the questions).
# Host ports: API 8090, Postgres 5434, Strapi 1337 (bound to this machine only). They do not clash with the other projects here.

services:

  spark-feedback-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark_feedback_api
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      strapi:
        condition: service_healthy
    environment:
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-4.1}
      AZURE_OPENAI_TRANSCRIBE_DEPLOYMENT: ${AZURE_OPENAI_TRANSCRIBE_DEPLOYMENT:-gpt-4o-transcribe}
      AZURE_OPENAI_TTS_DEPLOYMENT: ${AZURE_OPENAI_TTS_DEPLOYMENT:-}
      SPARK_DECISION_DEPLOYMENT: ${SPARK_DECISION_DEPLOYMENT:-${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-4.1}}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spark
      SPRING_DATASOURCE_USERNAME: spark
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-spark}
      STRAPI_URL: http://strapi:1337
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3003}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # One database, two schemas: `strapi` (the questions) and `feedback` (policies, sessions, answers).
  postgres:
    image: postgres:16-alpine
    container_name: spark_feedback_postgres
    environment:
      POSTGRES_DB: spark
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spark}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - spark_feedback_pg_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d spark"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Strapi Community (MIT): editors change the questions, their wording in 4 languages, and the branches here.
  strapi:
    build:
      context: ./strapi
    container_name: spark_feedback_strapi
    ports:
      - "127.0.0.1:1337:1337"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: spark
      DATABASE_USERNAME: spark
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-spark}
      DATABASE_SCHEMA: strapi
      APP_KEYS: ${STRAPI_APP_KEYS:-spark-key-1,spark-key-2,spark-key-3,spark-key-4}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:-spark-dev-admin-jwt-secret-change-me}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:-spark-dev-api-token-salt-change-me}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:-spark-dev-transfer-salt-change-me}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY:-spark-dev-encryption-key-change-me}
      JWT_SECRET: ${STRAPI_JWT_SECRET:-spark-dev-jwt-secret-change-me}
      STRAPI_ADMIN_EMAIL: ${STRAPI_ADMIN_EMAIL:-admin@spark.local}
      STRAPI_ADMIN_PASSWORD: ${STRAPI_ADMIN_PASSWORD:-SparkAdmin#2026}
      STRAPI_TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1337/_health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  spark_feedback_pg_data:
