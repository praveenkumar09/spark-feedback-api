server.port=8090
spring.application.name=spark-feedback-api

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Azure OpenAI (same resource as Voice Insights)
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY}
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-4.1}
spring.ai.azure.openai.chat.options.temperature=0.0

spark.openai.endpoint=${AZURE_OPENAI_ENDPOINT}
spark.openai.api-key=${AZURE_OPENAI_API_KEY}
spark.openai.transcribe-deployment=${AZURE_OPENAI_TRANSCRIBE_DEPLOYMENT:gpt-4o-transcribe}
spark.openai.tts-deployment=${AZURE_OPENAI_TTS_DEPLOYMENT:}
spark.openai.api-version=2025-03-01-preview
spark.tts.voice=${SPARK_TTS_VOICE:nova}
spark.tts.speed=${SPARK_TTS_SPEED:1.0}

# Spark's voice from Azure AI Speech neural voices (real Singapore voices). When a key and region are set this is used first;
# the Azure OpenAI voice above is the fallback. Rate: 0 = normal, -10 = 10% slower.
spark.speech.key=${AZURE_SPEECH_KEY:}
spark.speech.region=${AZURE_SPEECH_REGION:}
spark.speech.endpoint=${AZURE_SPEECH_ENDPOINT:}
spark.speech.rate-percent=${SPARK_SPEECH_RATE_PERCENT:-3}
spark.speech.voice.en=${SPARK_SPEECH_VOICE_EN:en-SG-LunaNeural}
spark.speech.voice.ms=${SPARK_SPEECH_VOICE_MS:ms-MY-YasminNeural}
spark.speech.voice.zh=${SPARK_SPEECH_VOICE_ZH:zh-SG-XiaoMinNeural}
spark.speech.voice.ta=${SPARK_SPEECH_VOICE_TA:ta-SG-VenbaNeural}

# Spring AI's decision model: yes/no from a free-text answer. Defaults to the chat deployment above (the best one deployed).
spark.decision.deployment=${SPARK_DECISION_DEPLOYMENT:${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-4.1}}
spark.decision.min-confidence=0.65
spark.decision.max-unclear-attempts=2

# Strapi (question configuration), read over the internal network
spark.strapi.url=${STRAPI_URL:http://strapi:1337}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/spark}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:spark}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:spark}
spark.db.schema=feedback

spark.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3003}
spark.session.ttl-hours=12
spark.login.max-failures=5
spark.login.lock-minutes=5

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Admin panel (/admin in the UI). Empty = switched off.
spark.admin.password=${SPARK_ADMIN_PASSWORD:}
